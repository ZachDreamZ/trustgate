name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # windows-latest images do not guarantee a discoverable full VS
      # instance, so drive MSVC via Ninja (preinstalled) instead of the
      # "Visual Studio 17 2022" generator (needs VS discovery).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Linux)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-junit ../junit.xml --output-on-failure

      # Dogfood: this repo's own CI is gated by its own action, using the
      # binary just built. CI uses single-config generators (Ninja on
      # Windows, Make on Linux), so the binary lands directly in build/
      # (the action appends .exe on Windows when needed).
      - name: Dogfood gate (own action, prebuilt binary)
        id: dogfood
        uses: ./
        with:
          binary: build/tg
          claims: dogfood/claims.json
          junit: junit.xml
          policy: dogfood/policy.json
          out: verdict.json
          sarif: trustgate.sarif

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trustgate-verdict-${{ runner.os }}
          path: |
            verdict.json
            trustgate.sarif
            junit.xml
            eval-results.json

      # Dogfood EvalOps: the repo's own eval scenarios gate the build too.
      - name: Dogfood evals
        shell: bash
        run: |
          BIN="build/tg"
          if [ ! -f "$BIN" ] && [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" eval --dir evals --repo . --out eval-results.json

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trustgate.sarif
          category: trustgate

  action-test:
    # Validates the consumer path: full source build through the published
    # action interface (no prebuilt binary), on both OSes.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run action (source build)
        id: tg
        uses: ./
        with:
          source-dir: .
          working-directory: action-test
          claims: claims.json
          policy: policy.json
          out: verdict.json
          sarif: ''

      - name: Assert PASS verdict
        shell: bash
        run: test "${{ steps.tg.outputs.verdict }}" = "PASS"

  action-test-release:
    # Validates the release-download fast path (no build at all) against the
    # latest published release. Bump release-tag when cutting a new release.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run action (release download)
        id: tg
        uses: ./
        with:
          release-tag: v0.2.0
          working-directory: action-test
          claims: claims.json
          policy: policy.json
          out: verdict.json
          sarif: ''

      - name: Assert PASS verdict (release)
        shell: bash
        run: test "${{ steps.tg.outputs.verdict }}" = "PASS"
