name: release

# Tagged releases with prebuilt binaries: `git tag v0.1.0 && git push origin v0.1.0`.
# Keep the tag in sync with the project VERSION in CMakeLists.txt / main.cpp.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: tg-windows-x64.zip
            stage: tg-windows-x64
            bin: build/tg.exe
          - os: ubuntu-latest
            asset: tg-linux-x64.tar.gz
            stage: tg-linux-x64
            bin: build/tg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Linux)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package and checksum
        shell: bash
        run: |
          STAGE="${{ matrix.stage }}"
          rm -rf dist && mkdir -p "dist/$STAGE"
          cp "${{ matrix.bin }}" LICENSE README.md "dist/$STAGE/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -E chdir dist cmake -E tar cf "../${{ matrix.asset }}" --format=zip -- "$STAGE"
          else
            cmake -E chdir dist cmake -E tar cfz "../${{ matrix.asset }}" -- "$STAGE"
          fi
          cmake -E sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          cat "${{ matrix.asset }}.sha256"

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.asset }}

      - name: Upload release asset and checksum
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          generate_release_notes: true
