name: TrustGate
description: >-
  Local trust gate for AI-written code. Blocks merges unless every AI claim
  cites exact files, tests, and runtime artifacts. No cloud, no data leaves
  the runner.
author: TrustGate contributors

inputs:
  binary:
    description: >-
      Path to a prebuilt tg binary, relative to working-directory unless
      absolute (skips checkout/configure/build). A missing .exe extension is
      appended automatically on Windows. NOTE: single-config generators
      (Ninja, Make) place the binary directly in the build dir
      (build/tg[.exe]); multi-config generators (Visual Studio) use
      build/<Config>/tg.exe.
    required: false
    default: ''
  source-dir:
    description: >-
      Existing TrustGate checkout to build, relative to the workflow workspace
      unless absolute (skips actions/checkout). Use 'source-dir: .' for
      self-hosting.
    required: false
    default: ''
  tool-ref:
    description: Git ref of ZachDreamZ/trustgate to build when source-dir is empty.
    required: false
    default: main
  tool-repo:
    description: >-
      Owner/repo hosting the releases used by release-tag
      (github.action_repository is empty for local actions, so this is explicit).
    required: false
    default: ZachDreamZ/trustgate
  release-tag:
    description: >-
      Download a prebuilt tg from this GitHub release tag instead of building
      (e.g. 'v0.1.0'). Skips checkout/configure/build; instant on runners.
      Takes precedence over source-dir/tool-ref, but not over binary.
    required: false
    default: ''
  release-sha256:
    description: >-
      Optional expected SHA-256 for the selected release archive. Use this for
      legacy releases without a published .sha256 sidecar. When omitted, the
      action downloads <asset>.sha256 and fails closed if it is unavailable or
      does not match.
    required: false
    default: ''
  working-directory:
    description: Directory holding claims/policy/junit files; verdict outputs land here too.
    required: false
    default: .
  claims:
    description: claims.json path, relative to working-directory.
    required: false
    default: claims.json
  junit:
    description: JUnit XML files, space-separated, relative to working-directory.
    required: false
    default: ''
  policy:
    description: Policy file, relative to working-directory.
    required: false
    default: .trustgate/policy.json
  quarantine:
    description: Quarantine file, relative to working-directory (passed only when present).
    required: false
    default: quarantine.yml
  lenient:
    description: "'true' demotes DENY findings to warnings (exit 0)."
    required: false
    default: 'false'
  fail-on-deny:
    description: "'false' always exits 0; inspect the verdict output instead."
    required: false
    default: 'true'
  out:
    description: Verdict JSON filename, relative to working-directory.
    required: false
    default: verdict.json
  sarif:
    description: SARIF filename, relative to working-directory ('' to skip).
    required: false
    default: trustgate.sarif

outputs:
  verdict:
    description: PASS, PASS_WITH_WARNINGS, or DENY.
    value: ${{ steps.gate.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows' && inputs.binary == '' && inputs.release-tag == ''
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      with:
        arch: x64

    - name: Resolve tool source
      if: inputs.binary == '' && inputs.release-tag == ''
      id: src
      shell: bash
      env:
        TG_SOURCE_DIR: ${{ inputs.source-dir }}
      run: |
        SRC="$TG_SOURCE_DIR"
        if [ -z "$SRC" ]; then SRC=".trustgate-dist"; fi
        case "$SRC" in
          /*|[A-Za-z]:*) ;;
          *) SRC="$GITHUB_WORKSPACE/$SRC" ;;
        esac
        echo "path=$SRC" >> "$GITHUB_OUTPUT"

    - name: Check out TrustGate
      if: inputs.binary == '' && inputs.release-tag == '' && inputs.source-dir == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ZachDreamZ/trustgate
        ref: ${{ inputs.tool-ref }}
        path: .trustgate-dist

    - name: Configure
      if: inputs.binary == '' && inputs.release-tag == ''
      shell: bash
      run: cmake -S "${{ steps.src.outputs.path }}" -B "${{ steps.src.outputs.path }}/build" -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      if: inputs.binary == '' && inputs.release-tag == ''
      shell: bash
      run: cmake --build "${{ steps.src.outputs.path }}/build" --config Release

    - name: Download and verify release binary
      if: inputs.binary == '' && inputs.release-tag != ''
      id: rel
      shell: bash
      env:
        TG_RELEASE_TAG: ${{ inputs.release-tag }}
        TG_TOOL_REPO: ${{ inputs.tool-repo }}
        TG_RELEASE_SHA256: ${{ inputs.release-sha256 }}
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then ASSET="tg-windows-x64.zip"; else ASSET="tg-linux-x64.tar.gz"; fi
        URL="https://github.com/$TG_TOOL_REPO/releases/download/$TG_RELEASE_TAG/$ASSET"
        CHECKSUM_URL="$URL.sha256"
        echo "downloading $URL"
        DEST="$RUNNER_TEMP/tg-rel"
        rm -rf "$DEST" && mkdir -p "$DEST/x"
        curl -sSL --fail -o "$DEST/pkg" "$URL"

        EXPECTED="$TG_RELEASE_SHA256"
        if [ -z "$EXPECTED" ]; then
          echo "downloading checksum $CHECKSUM_URL"
          curl -sSL --fail -o "$DEST/pkg.sha256" "$CHECKSUM_URL" || {
            echo "release checksum unavailable; refusing to execute unverified asset" >&2
            exit 1
          }
          EXPECTED=$(awk 'NR==1 {print $1}' "$DEST/pkg.sha256")
        fi
        case "$EXPECTED" in
          ''|*[!0-9A-Fa-f]*) echo "invalid SHA-256 value for $ASSET" >&2; exit 1 ;;
        esac
        if [ "${#EXPECTED}" -ne 64 ]; then
          echo "invalid SHA-256 length for $ASSET" >&2
          exit 1
        fi
        ACTUAL=$(cmake -E sha256sum "$DEST/pkg" | awk '{print $1}')
        if [ "${ACTUAL,,}" != "${EXPECTED,,}" ]; then
          echo "SHA-256 mismatch for $ASSET" >&2
          echo "expected: $EXPECTED" >&2
          echo "actual:   $ACTUAL" >&2
          exit 1
        fi
        echo "verified SHA-256 for $ASSET: $ACTUAL"

        cmake -E chdir "$DEST/x" cmake -E tar xf "$DEST/pkg"
        FOUND=$(find "$DEST/x" \( -name tg -o -name tg.exe \) -type f | head -1)
        if [ -z "$FOUND" ]; then echo "no tg binary inside $ASSET" >&2; exit 1; fi
        if [ "$RUNNER_OS" != "Windows" ]; then chmod +x "$FOUND"; fi
        echo "bin=$FOUND" >> "$GITHUB_OUTPUT"
        echo "downloaded and verified $ASSET ($FOUND)"

    - name: Gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TG_BINARY: ${{ inputs.binary }}
        TG_RELEASE_BIN: ${{ steps.rel.outputs.bin }}
        TG_SRC: ${{ steps.src.outputs.path }}
        TG_CLAIMS: ${{ inputs.claims }}
        TG_JUNIT: ${{ inputs.junit }}
        TG_POLICY: ${{ inputs.policy }}
        TG_QUARANTINE: ${{ inputs.quarantine }}
        TG_LENIENT: ${{ inputs.lenient }}
        TG_FAIL_ON_DENY: ${{ inputs.fail-on-deny }}
        TG_OUT: ${{ inputs.out }}
        TG_SARIF: ${{ inputs.sarif }}
      run: |
        BIN="$TG_BINARY"
        if [ -z "$BIN" ] && [ -n "$TG_RELEASE_BIN" ]; then BIN="$TG_RELEASE_BIN"; fi
        if [ -z "$BIN" ]; then BIN="$TG_SRC/build/tg"; fi
        case "$BIN" in
          /*|[A-Za-z]:*) ;;
          *) BIN="$GITHUB_WORKSPACE/${{ inputs.working-directory }}/$BIN" ;;
        esac
        if [ ! -f "$BIN" ] && [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
        if [ ! -f "$BIN" ]; then echo "tg binary not found: $BIN" >&2; exit 1; fi
        ARGS=(gate --claims "$TG_CLAIMS" --policy "$TG_POLICY" --repo "." --out "$TG_OUT")
        if [ -n "$TG_JUNIT" ]; then ARGS+=(--junit $TG_JUNIT); fi
        if [ -n "$TG_QUARANTINE" ] && [ -f "$TG_QUARANTINE" ]; then ARGS+=(--quarantine "$TG_QUARANTINE"); fi
        if [ -n "$TG_SARIF" ]; then ARGS+=(--sarif "$TG_SARIF"); fi
        if [ "$TG_LENIENT" = "true" ]; then ARGS+=(--lenient); fi
        set +e
        "$BIN" "${ARGS[@]}"
        RC=$?
        set -e
        VERDICT="UNKNOWN"
        if [ -f "$TG_OUT" ]; then
          VERDICT=$(grep -o '"verdict": *"[^"]*"' "$TG_OUT" | head -1 | cut -d'"' -f4)
          [ -z "$VERDICT" ] && VERDICT="UNKNOWN"
        fi
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        echo "trustgate verdict: $VERDICT (exit $RC)"
        if [ "$TG_FAIL_ON_DENY" = "true" ] && [ "$RC" -ne 0 ]; then exit "$RC"; fi
        exit 0
